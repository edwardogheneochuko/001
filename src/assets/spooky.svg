    <path d="M160 110 C150 100, 130 96, 110 102 C130 100, 145 108, 160 110 Z" />
    <path d="M320 90 C300 80, 280 78, 260 86 C280 82, 300 88, 320 90 Z" />
  </g>

  <!-- spooky silhouette tree -->
  <g transform="translate(120,180) scale(0.9)">
    <path d="M40 220 L58 220 L60 150 C66 130, 90 110, 94 88 C72 100, 54 90, 44 80 C36 92, 10 106, 6 128 C14 140, 26 150, 32 168 L34 220 Z" fill="#000" />
