<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="spooky scene">
  <defs>
    <radialGradient id="g1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="1" />
      <stop offset="60%" stop-color="#ffd9b8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- moon -->
  <circle cx="620" cy="110" r="72" fill="#fff9d9" />
  <circle cx="640" cy="95" r="8" fill="#000" opacity="0.06" />

  <!-- distant hills -->
  <path d="M0 350 C120 300, 240 380, 400 340 C560 300, 700 380, 800 340 L800 450 L0 450 Z" fill="#060606" />

  <!-- bats -->
  <g fill="#050505" transform="translate(40,20)">
